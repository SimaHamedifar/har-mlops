[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "har-mlops"
version = "0.1.0"
description = "MLOps pipeline for Human Activity Recognition"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "mlflow",
    "fastapi",
    "uvicorn",
]
[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx",
]
[tool.setuptools.packages.find]
where = ["src"]
